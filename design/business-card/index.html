<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Ray Wang · Business Card</title>
    <style>
      @font-face {
        font-family: "Sarasa UI SC";
        src: url("fonts/regular.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
      }

      @font-face {
        font-family: "Sarasa UI SC";
        src: url("fonts/semibold.woff2") format("woff2");
        font-weight: 600;
        font-style: normal;
      }

      @font-face {
        font-family: "Sarasa UI SC";
        src: url("fonts/bold.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
      }

      :root {
        --paper: #f5efe3;
        --ink: #182333;
        --small-ink: #191a1d;
        --orange: #ed673b;
        --soft-paper: #d0d4d8;
        --preview: #edece8;
        --font: "Sarasa UI SC", sans-serif;
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--preview);
        color: var(--ink);
        font-family: var(--font);
      }

      h1,
      h2,
      p,
      ul {
        margin: 0;
      }
      a {
        color: inherit;
        text-underline-offset: 0.2em;
      }
      :focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 4px;
      }

      .preview {
        max-width: 69rem;
        margin-inline: auto;
        padding: clamp(1.1rem, 5vw, 4rem);
      }

      .preview-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 0.25rem 1rem;
        flex-wrap: wrap;
        margin-bottom: 1.4rem;
      }

      .preview-header h1 {
        font-size: clamp(1.3rem, 4vw, 1.85rem);
      }
      .preview-header a {
        font-size: 0.925rem;
      }

      .sides {
        display: grid;
        gap: 1.6rem;
      }

      .side {
        min-width: 0;
      }

      .side-label {
        margin-bottom: 0.45rem;
        font-size: 0.875rem;
        font-weight: 500;
      }

      .face {
        position: relative;
        aspect-ratio: 5 / 3;
        container-type: inline-size;
        isolation: isolate;
      }

      .front {
        background: var(--paper);
        color: var(--ink);
      }
      .back {
        background: var(--ink);
        color: var(--paper);
      }

      .card {
        --unit: calc(100cqw / 90);
        --gutter: calc(8.5 * var(--unit));
        position: absolute;
        inset: 0;
      }

      .identity {
        position: absolute;
        top: calc(16 * var(--unit));
        left: var(--gutter);
      }

      .name {
        font-size: calc(12 * var(--unit));
        font-weight: 700;
        line-height: 1.03;
        letter-spacing: -0.028em;
        white-space: nowrap;
      }

      .role {
        margin-top: calc(3.65 * var(--unit));
        font-size: calc(3.65 * var(--unit));
        line-height: 1.2;
        font-weight: 600;
        letter-spacing: 0.115em;
        color: var(--small-ink);
      }

      .alias {
        position: absolute;
        inset: calc(9.25 * var(--unit)) var(--gutter) auto auto;
        font-size: calc(3.15 * var(--unit));
        font-weight: 600;
        line-height: 1.2;
        letter-spacing: 0.08em;
        color: var(--small-ink);
      }

      .home-qr {
        position: absolute;
        inset: auto calc(6.5 * var(--unit)) calc(6.6 * var(--unit)) auto;
        width: calc(16.5 * var(--unit));
        color: var(--small-ink);
      }

      .home-qr svg {
        display: block;
        width: 100%;
        height: auto;
      }

      .topics {
        position: absolute;
        top: calc(9.25 * var(--unit));
        left: var(--gutter);
        padding: 0;
        list-style: none;
        font-size: calc(3.95 * var(--unit));
        font-weight: 600;
        line-height: 1.15;
      }

      .research {
        margin: calc(1.05 * var(--unit)) 0 calc(2.4 * var(--unit));
        padding: 0;
        list-style: none;
        color: var(--soft-paper);
        font-size: calc(3.2 * var(--unit));
        font-weight: 400;
        line-height: 1.32;
      }

      .signature {
        position: absolute;
        inset: calc(11.75 * var(--unit)) var(--gutter) auto auto;
        width: calc(20.5 * var(--unit));
        height: auto;
      }

      .email {
        position: absolute;
        inset: auto auto calc(8.6 * var(--unit)) var(--gutter);
        font-size: calc(4.65 * var(--unit));
        font-weight: 600;
        line-height: 1.1;
        text-decoration: none;
      }

      .email:hover,
      .email:focus-visible {
        text-decoration: underline;
      }

      @media screen and (min-width: 48rem) {
        .sides {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @page {
        size: 96mm 60mm;
        margin: 0;
      }

      @media print {
        html,
        body {
          print-color-adjust: exact;
          -webkit-print-color-adjust: exact;
        }
        body {
          background: none;
        }
        .preview {
          max-width: none;
          padding: 0;
        }
        .preview-header,
        .side-label {
          display: none;
        }
        .sides {
          display: block;
        }
        .side + .side {
          break-before: page;
        }

        .face {
          width: 96mm;
          height: 60mm;
          aspect-ratio: auto;
          break-inside: avoid;
          overflow: clip;
        }

        .card {
          --unit: 1mm;
          inset: 3mm;
        }
      }
    </style>
  </head>
